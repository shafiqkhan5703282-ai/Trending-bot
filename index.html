<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Signal Engine</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #2962ff;
            --green: #00c853;
            --red: #d50000;
            --yellow: #ffd600;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard {
            background: var(--panel-bg);
            padding: 24px;
            border-radius: 12px;
            width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
        }

        .title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-connecting { background-color: rgba(255, 214, 0, 0.2); color: var(--yellow); }
        .status-live { background-color: rgba(0, 200, 83, 0.2); color: var(--green); }
        .status-disconnected { background-color: rgba(213, 0, 0, 0.2); color: var(--red); }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .data-card {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .data-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .data-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .signal-board {
            text-align: center;
            padding: 20px;
            border-radius: 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid #333;
        }

        #final-signal {
            font-size: 2rem;
            font-weight: 800;
            margin: 10px 0;
        }

        .signal-buy { color: var(--green); }
        .signal-sell { color: var(--red); }
        .signal-none { color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="header">
            <div class="title">Signal Engine</div>
            <div id="status" class="status-badge status-connecting">CONNECTING</div>
        </div>

        <div class="data-grid">
            <div class="data-card">
                <div class="data-label">Current Price</div>
                <div class="data-value" id="price">---</div>
            </div>
            <div class="data-card">
                <div class="data-label">Candles Built</div>
                <div class="data-value" id="candles">0</div>
            </div>
            <div class="data-card">
                <div class="data-label">EMA + MACD</div>
                <div class="data-value" id="trend">---</div>
            </div>
            <div class="data-card">
                <div class="data-label">RSI</div>
                <div class="data-value" id="rsi">---</div>
            </div>
        </div>

        <div class="signal-board">
            <div class="data-label">Action Required</div>
            <div id="final-signal" class="signal-none">NO TRADE</div>
            <div class="data-label" id="signal-reason">Awaiting confirmation...</div>
        </div>
    </div>

    <script>
        const UI = {
            status: document.getElementById('status'),
            price: document.getElementById('price'),
            candles: document.getElementById('candles'),
            trend: document.getElementById('trend'),
            rsi: document.getElementById('rsi'),
            finalSignal: document.getElementById('final-signal'),
            signalReason: document.getElementById('signal-reason')
        };

        let ws = null;
        let reconnectInterval = 3000; 

        function updateStatus(state) {
            UI.status.className = 'status-badge';
            if (state === 'CONNECTING') {
                UI.status.classList.add('status-connecting');
                UI.status.innerText = 'CONNECTING...';
            } else if (state === 'LIVE') {
                UI.status.classList.add('status-live');
                UI.status.innerText = 'LIVE';
            } else {
                UI.status.classList.add('status-disconnected');
                UI.status.innerText = 'DISCONNECTED';
            }
        }

        function connectWebSocket() {
            updateStatus('CONNECTING');
            
            // Point this to your Python backend WebSocket route
            ws = new WebSocket('ws://localhost:8000/stream');

            ws.onopen = () => {
                updateStatus('LIVE');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Update basic tick data
                if (data.price) UI.price.innerText = data.price.toFixed(5);
                if (data.candle_count) UI.candles.innerText = data.candle_count;
                
                // Update indicators
                if (data.indicators) {
                    UI.trend.innerText = data.indicators.trend || '---';
                    UI.rsi.innerText = data.indicators.rsi ? data.indicators.rsi.toFixed(2) : '---';
                }

                // Update Signal Engine
                if (data.signal) {
                    UI.finalSignal.innerText = data.signal;
                    UI.finalSignal.className = ''; 
                    
                    if (data.signal === 'BUY') {
                        UI.finalSignal.classList.add('signal-buy');
                        UI.signalReason.innerText = 'Strong uptrend confirmation';
                    } else if (data.signal === 'SELL') {
                        UI.finalSignal.classList.add('signal-sell');
                        UI.signalReason.innerText = 'Strong downtrend confirmation';
                    } else {
                        UI.finalSignal.classList.add('signal-none');
                        UI.signalReason.innerText = data.reason || 'Indicators conflict';
                    }
                }
            };

            ws.onclose = () => {
                updateStatus('DISCONNECTED');
                // Auto-reconnect logic
                setTimeout(connectWebSocket, reconnectInterval);
            };

            ws.onerror = (err) => {
                console.error('WebSocket Error:', err);
                ws.close(); // Trigger onclose to handle reconnect
            };
        }

        // Initialize connection
        connectWebSocket();
    </script>
</body>
</html>
