<script>
/* =========================================================
   AI SIGNAL ENGINE
   Technical-analysis engine:
   EMA + RSI + MACD + Momentum + Candle Structure
   Returns CALL / PUT / WAIT
   ========================================================= */

let signalTimer = null;
let analysisTimer = null;

const ENGINE = {
    minConfidence: 68,
    strongConfidence: 82,

    /* -----------------------------------------------------
       Main signal function
       ----------------------------------------------------- */
    generateSignal(candles) {

        if (!Array.isArray(candles) || candles.length < 60) {
            return {
                direction: "WAIT",
                confidence: 0,
                strength: "NO DATA",
                reason: "Not enough market data"
            };
        }

        const closes = candles.map(c => Number(c.close));
        const highs  = candles.map(c => Number(c.high));
        const lows   = candles.map(c => Number(c.low));

        const ema9  = EMA(closes, 9);
        const ema21 = EMA(closes, 21);
        const ema50 = EMA(closes, 50);

        const rsi = RSI(closes, 14);

        const macd = MACD(closes, 12, 26, 9);

        const atr = ATR(candles, 14);

        const last = candles[candles.length - 1];
        const prev = candles[candles.length - 2];

        const lastClose = closes[closes.length - 1];

        let callScore = 0;
        let putScore = 0;

        const reasons = [];

        /* -------------------------------------------------
           1. EMA TREND
           ------------------------------------------------- */

        if (ema9 > ema21) {
            callScore += 18;
            reasons.push("EMA bullish");
        } else {
            putScore += 18;
            reasons.push("EMA bearish");
        }

        if (ema21 > ema50) {
            callScore += 15;
        } else {
            putScore += 15;
        }

        /* -------------------------------------------------
           2. RSI
           ------------------------------------------------- */

        if (rsi >= 52 && rsi <= 68) {
            callScore += 15;
            reasons.push("RSI bullish");
        }

        if (rsi <= 48 && rsi >= 32) {
            putScore += 15;
            reasons.push("RSI bearish");
        }

        /* Avoid chasing extreme RSI */
        if (rsi > 72) {
            callScore -= 10;
        }

        if (rsi < 28) {
            putScore -= 10;
        }

        /* -------------------------------------------------
           3. MACD
           ------------------------------------------------- */

        if (macd.macd > macd.signal && macd.histogram > 0) {
            callScore += 18;
            reasons.push("MACD bullish");
        }

        if (macd.macd < macd.signal && macd.histogram < 0) {
            putScore += 18;
            reasons.push("MACD bearish");
        }

        /* -------------------------------------------------
           4. PRICE MOMENTUM
           ------------------------------------------------- */

        const momentumLookback = 5;

        const oldPrice =
            closes[closes.length - 1 - momentumLookback];

        if (lastClose > oldPrice) {
            callScore += 10;
        }

        if (lastClose < oldPrice) {
            putScore += 10;
        }

        /* -------------------------------------------------
           5. CANDLE STRUCTURE
           ------------------------------------------------- */

        const candleBody =
            Math.abs(last.close - last.open);

        const candleRange =
            last.high - last.low;

        if (candleRange > 0) {

            const bodyRatio =
                candleBody / candleRange;

            /* Strong bullish candle */
            if (
                last.close > last.open &&
                bodyRatio >= 0.55
            ) {
                callScore += 12;
                reasons.push("Bullish candle");
            }

            /* Strong bearish candle */
            if (
                last.close < last.open &&
                bodyRatio >= 0.55
            ) {
                putScore += 12;
                reasons.push("Bearish candle");
            }
        }

        /* -------------------------------------------------
           6. SHORT-TERM CANDLE CONFIRMATION
           ------------------------------------------------- */

        if (prev.close < prev.open &&
            last.close > last.open &&
            last.close > prev.open) {

            callScore += 8;
            reasons.push("Bullish reversal");
        }

        if (prev.close > prev.open &&
            last.close < last.open &&
            last.close < prev.open) {

            putScore += 8;
            reasons.push("Bearish reversal");
        }

        /* -------------------------------------------------
           7. VOLATILITY FILTER
           ------------------------------------------------- */

        const range =
            last.high - last.low;

        if (atr > 0) {

            /* Extremely large candle = unstable entry */
            if (range > atr * 2.2) {
                callScore -= 12;
                putScore -= 12;
                reasons.push("High volatility");
            }

            /* Extremely small movement = weak setup */
            if (range < atr * 0.25) {
                callScore -= 8;
                putScore -= 8;
                reasons.push("Low volatility");
            }
        }

        /* -------------------------------------------------
           FINAL DECISION
           ------------------------------------------------- */

        callScore = Math.max(0, Math.min(100, callScore));
        putScore  = Math.max(0, Math.min(100, putScore));

        const difference =
            Math.abs(callScore - putScore);

        let direction = "WAIT";
        let confidence = 0;

        if (
            callScore > putScore &&
            callScore >= ENGINE.minConfidence &&
            difference >= 15
        ) {
            direction = "CALL";
            confidence = Math.round(
                Math.min(96, callScore)
            );
        }

        else if (
            putScore > callScore &&
            putScore >= ENGINE.minConfidence &&
            difference >= 15
        ) {
            direction = "PUT";
            confidence = Math.round(
                Math.min(96, putScore)
            );
        }

        else {
            direction = "WAIT";
            confidence = Math.round(
                Math.max(callScore, putScore)
            );
        }

        let strength = "WEAK";

        if (confidence >= ENGINE.strongConfidence) {
            strength = "STRONG";
        }
        else if (confidence >= ENGINE.minConfidence) {
            strength = "MEDIUM";
        }

        return {
            direction,
            confidence,
            strength,
            rsi: Number(rsi.toFixed(2)),
            ema9: Number(ema9.toFixed(6)),
            ema21: Number(ema21.toFixed(6)),
            ema50: Number(ema50.toFixed(6)),
            macd: Number(macd.macd.toFixed(6)),
            signal: Number(macd.signal.toFixed(6)),
            atr: Number(atr.toFixed(6)),
            callScore,
            putScore,
            reasons: reasons.slice(-5)
        };
    }
};


/* =========================================================
   EMA
   ========================================================= */

function EMA(values, period) {

    if (!values || values.length < period) {
        return 0;
    }

    const multiplier =
        2 / (period + 1);

    let ema = values
        .slice(0, period)
        .reduce((a, b) => a + b, 0) / period;

    for (
        let i = period;
        i < values.length;
        i++
    ) {
        ema =
            (values[i] - ema) *
            multiplier +
            ema;
    }

    return ema;
}


/* =========================================================
   RSI
   ========================================================= */

function RSI(values, period = 14) {

    if (values.length <= period) {
        return 50;
    }

    let gains = 0;
    let losses = 0;

    for (let i = 1; i <= period; i++) {

        const change =
            values[i] - values[i - 1];

        if (change >= 0) {
            gains += change;
        } else {
            losses += Math.abs(change);
        }
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for (
        let i = period + 1;
        i < values.length;
        i++
    ) {

        const change =
            values[i] - values[i - 1];

        const gain =
            change > 0 ? change : 0;

        const loss =
            change < 0 ? Math.abs(change) : 0;

        avgGain =
            ((avgGain * (period - 1)) + gain) /
            period;

        avgLoss =
            ((avgLoss * (period - 1)) + loss) /
            period;
    }

    if (avgLoss === 0) {
        return 100;
    }

    const rs =
        avgGain / avgLoss;

    return 100 - (100 / (1 + rs));
}


/* =========================================================
   MACD
   ========================================================= */

function MACD(
    values,
    fastPeriod = 12,
    slowPeriod = 26,
    signalPeriod = 9
) {

    if (values.length < slowPeriod + signalPeriod) {

        return {
            macd: 0,
            signal: 0,
            histogram: 0
        };
    }

    const fastEMA =
        EMA(values, fastPeriod);

    const slowEMA =
        EMA(values, slowPeriod);

    const macdValue =
        fastEMA - slowEMA;

    /*
       Build MACD history for signal calculation
    */

    const macdHistory = [];

    for (
        let i = slowPeriod;
        i < values.length;
        i++
    ) {

        const subset =
            values.slice(0, i + 1);

        const fast =
            EMA(subset, fastPeriod);

        const slow =
            EMA(subset, slowPeriod);

        macdHistory.push(
            fast - slow
        );
    }

    const signal =
        EMA(macdHistory, signalPeriod);

    return {
        macd: macdValue,
        signal,
        histogram: macdValue - signal
    };
}


/* =========================================================
   ATR
   ========================================================= */

function ATR(candles, period = 14) {

    if (candles.length < period + 1) {
        return 0;
    }

    const trueRanges = [];

    for (
        let i = 1;
        i < candles.length;
        i++
    ) {

        const current =
            candles[i];

        const previous =
            candles[i - 1];

        const tr1 =
            current.high - current.low;

        const tr2 =
            Math.abs(
                current.high -
                previous.close
            );

        const tr3 =
            Math.abs(
                current.low -
                previous.close
            );

        trueRanges.push(
            Math.max(tr1, tr2, tr3)
        );
    }

    const recent =
        trueRanges.slice(-period);

    return recent.reduce(
        (a, b) => a + b,
        0
    ) / recent.length;
}


/* =========================================================
   CANDLE NORMALIZER
   ========================================================= */

function normalizeCandles(raw) {

    if (!Array.isArray(raw)) {
        return [];
    }

    return raw
        .map(c => {

            return {
                time: Number(
                    c.time ||
                    c.timestamp ||
                    Date.now()
                ),

                open: Number(c.open),

                high: Number(c.high),

                low: Number(c.low),

                close: Number(c.close)
            };

        })
        .filter(c =>
            Number.isFinite(c.open) &&
            Number.isFinite(c.high) &&
            Number.isFinite(c.low) &&
            Number.isFinite(c.close)
        );
}


/* =========================================================
   LIVE DATA INTERFACE
   ---------------------------------------------------------
   Connect your REAL candle feed to this function.

   Example:

   updateMarketData([
       {
           time: 123,
           open: 1.1000,
           high: 1.1010,
           low: 1.0995,
           close: 1.1008
       }
   ]);

   ========================================================= */

let latestCandles = [];

function updateMarketData(rawCandles) {

    const candles =
        normalizeCandles(rawCandles);

    if (candles.length < 60) {

        console.warn(
            "AI Engine: waiting for at least 60 candles."
        );

        return null;
    }

    latestCandles = candles;

    const result =
        ENGINE.generateSignal(candles);

    return result;
}


/* =========================================================
   RUN ENGINE
   ========================================================= */

function runAIEngine(candles = latestCandles) {

    const result =
        updateMarketData(candles);

    if (!result) {
        return {
            direction: "WAIT",
            confidence: 0,
            strength: "NO DATA"
        };
    }

    console.log(
        "AI SIGNAL:",
        result.direction,
        "| Confidence:",
        result.confidence + "%",
        "| Strength:",
        result.strength
    );

    return result;
}


/* =========================================================
   SAFE SIGNAL DISPLAY
   ---------------------------------------------------------
   This replaces random CALL/PUT generation.
   ========================================================= */

function displayAISignal(result) {

    if (!result) return;

    const signalElement =
        document.getElementById("signal");

    const accuracyElement =
        document.getElementById("accuracy");

    const directionElement =
        document.getElementById("direction");

    const strengthElement =
        document.getElementById("strength");

    if (signalElement) {
        signalElement.textContent =
            result.direction;
    }

    if (directionElement) {
        directionElement.textContent =
            result.direction;
    }

    if (accuracyElement) {
        accuracyElement.textContent =
            result.confidence + "%";
    }

    if (strengthElement) {
        strengthElement.textContent =
            result.strength;
    }
}


/* =========================================================
   MAIN SIGNAL HANDLER
   ---------------------------------------------------------
   IMPORTANT:
   Do NOT use Math.random() for trading direction.
   ========================================================= */

function processMarketSignal(candles) {

    const result =
        runAIEngine(candles);

    displayAISignal(result);

    return result;
}


/* =========================================================
   OPTIONAL AUTO-SCAN
   ---------------------------------------------------------
   Scans every 8 seconds only when live candle data
   has been supplied to latestCandles.
   ========================================================= */

function startAIScanner() {

    stopAIScanner();

    analysisTimer =
        setInterval(() => {

            if (
                latestCandles &&
                latestCandles.length >= 60
            ) {

                const result =
                    runAIEngine(latestCandles);

                displayAISignal(result);
            }

        }, 8000);
}


function stopAIScanner() {

    if (analysisTimer) {

        clearInterval(
            analysisTimer
        );

        analysisTimer = null;
    }
}


/* =========================================================
   EXPORT TO GLOBAL WINDOW
   ========================================================= */

window.AISignalEngine = {
    generateSignal:
        ENGINE.generateSignal.bind(ENGINE),

    updateMarketData,

    runAIEngine,

    processMarketSignal,

    startAIScanner,

    stopAIScanner
};

</script>
