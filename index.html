      padding: 0;

      margin-top: 4px;
    }

    .value.active { color: #22c55e; }
    .value.cyan { color: #38bdf8; }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background-color: #1a2234;
      border: 1px solid #2a364f;
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {

    }

    .btn-generate {

      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;

      transition: background 0.2s ease;
    }

    .btn-generate:hover {

    }

    .screen {
      display: none;
    }

    }

    .analyzing-box {
      text-align: center;
      padding: 20px 10px;
    }

    .pair-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    .chart-box {
      height: 140px;
      background: #1a2234;
      border-radius: 10px;
      border: 1px solid #2a364f;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
    }

    canvas {

    }

    .metrics-grid {

      gap: 8px;
      margin-bottom: 15px;

      padding: 6px;

      font-size: 11px;

      border: 1px solid #22c55e33;

<script>

/* =========================================================
   GLOBALS
   ========================================================= */

let canvas =
  document.getElementById("liveCanvas");

let ctx =
  canvas.getContext("2d");

let animId = null;
let analysisTimeout = null;


/* =========================================================
   CANVAS SIZE
   ========================================================= */

function resizeCanvas() {

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    Math.max(1, Math.floor(rect.width * dpr));

  canvas.height =
    Math.max(1, Math.floor(rect.height * dpr));

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}


/* =========================================================
   EMA
   ========================================================= */

function EMA(values, period) {

  if (!values || values.length < period) {
    return 0;
  }

  const multiplier =
    2 / (period + 1);

  let ema =
    values
      .slice(0, period)
      .reduce((a, b) => a + b, 0) / period;

  for (
    let i = period;
    i < values.length;
    i++
  ) {

    ema =
      (values[i] - ema) *
      multiplier +
      ema;
  }

  return ema;
}


/* =========================================================
   RSI
   ========================================================= */

function RSI(values, period = 14) {

  if (
    !Array.isArray(values) ||
    values.length <= period
  ) {
    return 50;
  }

  let gains = 0;
  let losses = 0;

  for (
    let i = 1;
    i <= period;
    i++
  ) {

    const change =
      values[i] - values[i - 1];

    if (change >= 0) {
      gains += change;
    } else {
      losses += Math.abs(change);
    }
  }

  let avgGain =
    gains / period;

  let avgLoss =
    losses / period;

  for (
    let i = period + 1;
    i < values.length;
    i++
  ) {

    const change =
      values[i] - values[i - 1];

    const gain =
      change > 0 ? change : 0;

    const loss =
      change < 0 ? Math.abs(change) : 0;

    avgGain =
      ((avgGain * (period - 1)) + gain) /
      period;

    avgLoss =
      ((avgLoss * (period - 1)) + loss) /
      period;
  }

  if (avgLoss === 0) {
    return 100;
  }

  const rs =
    avgGain / avgLoss;

  return 100 - (100 / (1 + rs));
}


/* =========================================================
   MACD
   ========================================================= */

function MACD(
  values,
  fastPeriod = 12,
  slowPeriod = 26,
  signalPeriod = 9
) {

  if (
    !Array.isArray(values) ||
    values.length <
      slowPeriod + signalPeriod
  ) {

    return {
      macd: 0,
      signal: 0,
      histogram: 0
    };
  }

  const macdHistory = [];

  for (
    let i = slowPeriod - 1;
    i < values.length;
    i++
  ) {

    const subset =
      values.slice(0, i + 1);

    const fast =
      EMA(subset, fastPeriod);

    const slow =
      EMA(subset, slowPeriod);

    macdHistory.push(
      fast - slow
    );
  }

  const macdValue =
    macdHistory[macdHistory.length - 1];

  const signal =
    EMA(
      macdHistory,
      signalPeriod
    );

  return {
    macd: macdValue,
    signal: signal,
    histogram:
      macdValue - signal
  };
}


/* =========================================================
   ATR
   ========================================================= */

function ATR(candles, period = 14) {

  if (
    !Array.isArray(candles) ||
    candles.length < period + 1
  ) {
    return 0;
  }

  const trueRanges = [];

  for (
    let i = 1;
    i < candles.length;
    i++
  ) {

    const current =
      candles[i];

    const previous =
      candles[i - 1];

    const tr1 =
      current.high -
      current.low;

    const tr2 =
      Math.abs(
        current.high -
        previous.close
      );

    const tr3 =
      Math.abs(
        current.low -
        previous.close
      );

    trueRanges.push(
      Math.max(
        tr1,
        tr2,
        tr3
      )
    );
  }

  const recent =
    trueRanges.slice(-period);

  return recent.reduce(
    (a, b) => a + b,
    0
  ) / recent.length;
}


/* =========================================================
   TECHNICAL SIGNAL ENGINE
   ========================================================= */

function analyzeCandles(candles) {

  if (
    !Array.isArray(candles) ||
    candles.length < 60
  ) {

    return {
      direction: "WAIT",
      confidence: 0,
      strength: "NO DATA",
      trend: "WAIT",
      rsi: 50,
      volatility: "LOW"
    };
  }

  const closes =
    candles.map(
      c => Number(c.close)
    );

  const ema9 =
    EMA(closes, 9);

  const ema21 =
    EMA(closes, 21);

  const ema50 =
    EMA(closes, 50);

  const rsi =
    RSI(closes, 14);

  const macd =
    MACD(closes, 12, 26, 9);

  const atr =
    ATR(candles, 14);

  const last =
    candles[candles.length - 1];

  const previous =
    candles[candles.length - 2];

  let callScore = 0;
  let putScore = 0;

  /* EMA trend */

  if (ema9 > ema21) {
    callScore += 18;
  } else {
    putScore += 18;
  }

  if (ema21 > ema50) {
    callScore += 15;
  } else {
    putScore += 15;
  }


  /* RSI */

  if (
    rsi >= 52 &&
    rsi <= 68
  ) {
    callScore += 15;
  }

  if (
    rsi <= 48 &&
    rsi >= 32
  ) {
    putScore += 15;
  }


  /* MACD */

  if (
    macd.macd > macd.signal &&
    macd.histogram > 0
  ) {
    callScore += 18;
  }

  if (
    macd.macd < macd.signal &&
    macd.histogram < 0
  ) {
    putScore += 18;
  }


  /* Momentum */

  const oldPrice =
    closes[
      closes.length - 6
    ];

  if (last.close > oldPrice) {
    callScore += 10;
  }

  if (last.close < oldPrice) {
    putScore += 10;
  }


  /* Candle structure */

  const candleBody =
    Math.abs(
      last.close -
      last.open
    );

  const candleRange =
    last.high -
    last.low;

  if (candleRange > 0) {

    const bodyRatio =
      candleBody /
      candleRange;

    if (
      last.close >
        last.open &&
      bodyRatio >= 0.55
    ) {
      callScore += 12;
    }

    if (
      last.close <
        last.open &&
      bodyRatio >= 0.55
    ) {
      putScore += 12;
    }
  }


  /* Reversal confirmation */

  if (
    previous.close <
      previous.open &&
    last.close >
      last.open &&
    last.close >
      previous.open
  ) {
    callScore += 8;
  }

  if (
    previous.close >
      previous.open &&
    last.close <
      last.open &&
    last.close <
      previous.open
  ) {
    putScore += 8;
  }


  /* Volatility */

  let volatility =
    "NORMAL";

  if (atr > 0) {

    const range =
      last.high -
      last.low;

    if (
      range >
      atr * 2.2
    ) {

      volatility =
        "HIGH";

      callScore -= 12;
      putScore -= 12;
    }

    if (
      range <
      atr * 0.25
    ) {

      volatility =
        "LOW";

      callScore -= 8;
      putScore -= 8;
    }
  }


  callScore =
    Math.max(
      0,
      Math.min(
        100,
        callScore
      )
    );

  putScore =
    Math.max(
      0,
      Math.min(
        100,
        putScore
      )
    );


  const difference =
    Math.abs(
      callScore -
      putScore
    );


  let direction =
    "WAIT";

  let confidence =
    Math.round(
      Math.max(
        callScore,
        putScore
      )
    );


  /*
     WAIT is deliberately used when
     indicators disagree.
  */

  if (
    callScore >
      putScore &&
    callScore >= 68 &&
    difference >= 15
  ) {

    direction =
      "CALL";

  }

  else if (
    putScore >
      callScore &&
    putScore >= 68 &&
    difference >= 15
  ) {

    direction =
      "PUT";

  }

  else {

    direction =
      "WAIT";

    confidence =
      Math.min(
        confidence,
        67
      );
  }


  let strength =
    "WEAK";

  if (
    confidence >= 82 &&
    direction !== "WAIT"
  ) {

    strength =
      "STRONG";

  }

  else if (
    confidence >= 68 &&
    direction !== "WAIT"
  ) {

    strength =
      "MEDIUM";

  }

  else {

    strength =
      "WAIT";
  }


  let trend =
    "SIDEWAYS";

  if (
    ema9 > ema21 &&
    ema21 > ema50
  ) {

    trend =
      "BULLISH";

  }

  else if (
    ema9 < ema21 &&
    ema21 < ema50
  ) {

    trend =
      "BEARISH";
  }


  return {
    direction,
    confidence,
    strength,
    trend,
    rsi,
    volatility,
    callScore,
    putScore
  };
}


/* =========================================================
   DEMO/FALLBACK CANDLE GENERATOR
   =========================================================

   This is NOT live broker data.

   It exists only so the application remains functional
   when no live market-data API has been connected.

   Do not interpret its output as a real prediction.
   ========================================================= */

function createDemoCandles() {

  const candles = [];

  let price = 100;

  for (
    let i = 0;
    i < 100;
    i++
  ) {

    const previous =
      price;

    const movement =
      Math.sin(i * 0.27) * 0.18 +
      Math.cos(i * 0.11) * 0.12;

    price =
      previous +
      movement;

    const open =
      previous;

    const close =
      price;

    const high =
      Math.max(
        open,
        close
      ) + 0.08;

    const low =
      Math.min(
        open,
        close
      ) - 0.08;

    candles.push({
      time:
        Date.now() -
        (100 - i) * 60000,

      open,
      high,
      low,
      close
    });
  }

  return candles;
}


/* =========================================================
   UPDATE ANALYZING METRICS
   ========================================================= */

function updateAnalysisDisplay(result) {

  const trend =
    document.getElementById(
      "trendMetric"
    );

  const rsi =
    document.getElementById(
      "rsiMetric"
    );

  const vol =
    document.getElementById(
      "volMetric"
    );

  if (trend) {

    trend.innerText =
      "Trend: " +
      result.trend;
  }

  if (rsi) {

    rsi.innerText =
      "RSI: " +
      Number(
        result.rsi
      ).toFixed(1);
  }

  if (vol) {

    vol.innerText =
      "Vol: " +
      result.volatility;
  }
}


/* =========================================================
   START ANALYSIS
   ========================================================= */

function startAnalysis() {

  clearTimeout(
    analysisTimeout
  );

  if (animId) {
    cancelAnimationFrame(
      animId
    );
  }

  const pair =
    document.getElementById(
      "pairSelect"
    ).value;


  document.getElementById(
    "analyzingPair"
  ).innerText =
    pair;


  document.getElementById(
    "formScreen"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "signalScreen"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "analyzingScreen"
  ).classList.add(
    "active"
  );


  resizeCanvas();


  /*
     Generate local fallback candles
     so the UI works without crashing.
  */

  const candles =
    createDemoCandles();


  const analysis =
    analyzeCandles(
      candles
    );


  updateAnalysisDisplay(
    analysis
  );


  /* Canvas animation */

  let step = 0;

  function animate() {

    const width =
      canvas.clientWidth;

    const height =
      canvas.clientHeight;

    ctx.clearRect(
      0,
      0,
      width,
      height
    );

    ctx.beginPath();

    ctx.strokeStyle =
      "#38bdf8";

    ctx.lineWidth =
      2;

    for (
      let x = 0;
      x < width;
      x++
    ) {

      const y =
        height / 2 +
        Math.sin(
          (x + step) *
          0.05
        ) * 20 +
        Math.cos(
          (x + step) *
          0.02
        ) * 10;

      if (x === 0) {

        ctx.moveTo(
          x,
          y
        );

      } else {

        ctx.lineTo(
          x,
          y
        );
      }
    }

    ctx.stroke();

    step += 4;

    animId =
      requestAnimationFrame(
        animate
      );
  }


  animate();


  document.getElementById(
    "statusText"
  ).innerText =
    "Analyzing EMA • RSI • MACD • momentum...";


  /*
     Keep the original 3-second
     analysis animation.
  */

  analysisTimeout =
    setTimeout(
      function() {

        if (animId) {

          cancelAnimationFrame(
            animId
          );

          animId =
            null;
        }

        showSignal(
          pair,
          analysis
        );

      },
      3000
    );
}


/* =========================================================
   SHOW SIGNAL
   ========================================================= */

function showSignal(
  pair,
  analysis
) {

  document.getElementById(
    "analyzingScreen"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "signalScreen"
  ).classList.add(
    "active"
  );


  const dirElem =
    document.getElementById(
      "signalDir"
    );

  const borderElem =
    document.getElementById(
      "signalBorder"
    );


  /*
     CALL
  */

  if (
    analysis.direction ===
    "CALL"
  ) {

    dirElem.innerText =
      "▲ UP (CALL)";

    dirElem.className =
      "signal-direction";

    borderElem.style.borderColor =
      "#22c55e";
  }


  /*
     PUT
  */

  else if (
    analysis.direction ===
    "PUT"
  ) {

    dirElem.innerText =
      "▼ DOWN (PUT)";

    dirElem.className =
      "signal-direction put";

    borderElem.style.borderColor =
      "#ef4444";
  }


  /*
     WAIT
  */

  else {

    dirElem.innerText =
      "⏸ WAIT";

    dirElem.className =
      "signal-direction wait";

    borderElem.style.borderColor =
      "#f59e0b";
  }


  document.getElementById(
    "signalPairDisplay"
  ).innerText =
    pair;


  const timerValue =
    parseInt(
      document.getElementById(
        "timerSelect"
      ).value,
      10
    );


  let timerText;


  if (
    timerValue < 60
  ) {

    timerText =
      timerValue +
      "s";

  }

  else if (
    timerValue === 3600
  ) {

    timerText =
      "1 Hour";

  }

  else {

    timerText =
      (timerValue / 60) +
      " Min";
  }


  document.getElementById(
    "signalAcc"
  ).innerText =
    analysis.confidence +
    "%";


  document.getElementById(
    "signalTime"
  ).innerText =
    timerText;


  document.getElementById(
    "signalStrength"
  ).innerText =
    analysis.strength;


  /*
     Execution display.
     This is only a display time and
     does not place a broker trade.
  */

  const now =
    new Date();

  now.setMinutes(
    now.getMinutes() + 1
  );


  document.getElementById(
    "tradeTime"
  ).innerText =
    now.toTimeString()
      .split(" ")[0];
}


/* =========================================================
   RESET
   ========================================================= */

function resetForm() {

  clearTimeout(
    analysisTimeout
  );


  if (animId) {

    cancelAnimationFrame(
      animId
    );

    animId =
      null;
  }


  document.getElementById(
    "signalScreen"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "analyzingScreen"
  ).classList.remove(
    "active"
  );


  document.getElementById(
    "formScreen"
  ).classList.add(
    "active"
  );


  document.getElementById(
    "statusText"
  ).innerText =
    "Scanning candles & calculating signal...";
}


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();

</script>
