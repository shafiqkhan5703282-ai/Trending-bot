<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Signal Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #121824;
      border-radius: 16px;
      border: 1px solid #1e293b;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Top Stats Bar */
    .status-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .status-card {
      background: #1a2234;
      border: 1px solid #2a364f;
      border-radius: 10px;
      padding: 8px 5px;
      text-align: center;
    }

    .status-card .label {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-card .value {
      font-size: 13px;
      font-weight: bold;
      margin-top: 4px;
    }

    .value.active { color: #22c55e; }
    .value.cyan { color: #38bdf8; }

    /* Form Section */
    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background-color: #1a2234;
      border: 1px solid #2a364f;
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: #3b82f6;
    }

    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .btn-generate:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    /* Analyzing Screen */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .analyzing-box {
      text-align: center;
      padding: 20px 10px;
    }

    .pair-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #38bdf8;
    }

    .chart-box {
      height: 140px;
      background: #1a2234;
      border-radius: 10px;
      border: 1px solid #2a364f;
      margin-bottom: 15px;
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .metric-badge {
      background: #1a2234;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      color: #22c55e;
      border: 1px solid #22c55e33;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Signal Card Screen */
    .signal-card {
      background: #1a2234;
      border: 2px solid #22c55e;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .signal-direction {
      font-size: 32px;
      font-weight: 900;
      color: #22c55e;
      margin: 10px 0;
      letter-spacing: 1px;
    }

    .signal-direction.put {
      color: #ef4444;
    }

    .signal-details {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 15px;
      line-height: 1.6;
    }

    .time-badge {
      background: #2563eb;
      color: #fff;
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 15px;
    }

    .btn-secondary {
      width: 100%;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

  <script>
    let canvas = document.getElementById("liveCanvas");
    let ctx = canvas.getContext("2d");
    let animId;

    function startAnalysis() {
      const pair = document.getElementById("pairSelect").value;
      document.getElementById("analyzingPair").innerText = pair;

      // Switch screens
      document.getElementById("formScreen").classList.remove("active");
      document.getElementById("analyzingScreen").classList.add("active");

      // Draw dynamic wave animation
      let step = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 2;

        for (let x = 0; x < canvas.width; x++) {
          let y = canvas.height / 2 + Math.sin((x + step) * 0.05) * 20 + Math.cos((x + step) * 0.02) * 10;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        step += 4;
        animId = requestAnimationFrame(animate);
      }
      animate();

      // Show signal after 3 seconds
      setTimeout(() => {
        cancelAnimationFrame(animId);
        showSignal(pair);
      }, 3000);
    }

    function showSignal(pair) {
      document.getElementById("analyzingScreen").classList.remove("active");
      document.getElementById("signalScreen").classList.add("active");

      const isCall = Math.random() > 0.4;
      const accuracy = Math.floor(Math.random() * 8) + 90;
      
      const dirElem = document.getElementById("signalDir");
      const borderElem = document.getElementById("signalBorder");
      
      if (isCall) {
        dirElem.innerText = "▲ UP (CALL)";
        dirElem.className = "signal-direction";
        borderElem.style.borderColor = "#22c55e";
      } else {
        dirElem.innerText = "▼ DOWN (PUT)";
        dirElem.className = "signal-direction put";
        borderElem.style.borderColor = "#ef4444";
      }

      document.getElementById("signalPairDisplay").innerText = pair;

      const timerValue = parseInt(document.getElementById("timerSelect").value);

      let timerText;

      if (timerValue < 60) {
        timerText = timerValue + "s";
      } else if (timerValue === 3600) {
        timerText = "1 Hour";
      } else {
        timerText = (timerValue / 60) + " Min";
      }

      document.getElementById("signalAcc").innerText = accuracy + "%";
      document.getElementById("signalTime").innerText = timerText;

      // Calculate current time + 1 min for execution display
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      document.getElementById("tradeTime").innerText = now.toTimeString().split(' ')[0];
    }

    function resetForm() {
      document.getElementById("signalScreen").classList.remove("active");
      document.getElementById("formScreen").classList.add("active");
    }
  </script>

</html>
